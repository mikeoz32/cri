name = "github_issue"
version = "0.1.0"
abi = "cri.extension.v1"
wasm = "plugin.wasm"

[permissions]
network = ["https://api.github.com"]
secrets = ["GITHUB_TOKEN"]
filesystem_read = []
filesystem_write = []
shell = false
model = false

[[tools]]
name = "github.get_issue"
description = "Fetch a GitHub issue through host-mediated HTTP"
entrypoint = "cri_call"

[[commands]]
name = "github:open-issue"
title = "Open GitHub issue"
entrypoint = "cri_call"

[[ui.status_items]]
id = "github.rate_limit"
title = "GitHub API rate limit"
entrypoint = "cri_call"
